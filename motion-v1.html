  const getCart=()=>{try{const v=JSON.parse(localStorage.getItem('zelpeto_inquiry_cart')||JSON.stringify(window.__cartBackup||{}));return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch{return {}}};
  const putCart=c=>{try{localStorage.setItem('zelpeto_inquiry_cart',JSON.stringify(c))}catch(e){window.__cartBackup=c}updateCount()};
  const updateCount=()=>{const n=Object.values(getCart()).reduce((s,v)=>s+(Math.max(0,Number(v)||0)),0);document.querySelectorAll('.cart-count').forEach(x=>{x.textContent=n;x.toggleAttribute('data-empty',n===0)})};
  const toast=message=>{let el=byId('feedback-toast');if(!el){el=document.createElement('div');el.id='feedback-toast';el.style.cssText='position:fixed;bottom:85px;right:20px;background:#19344f;color:white;padding:12px 18px;border-radius:9px;z-index:80;box-shadow:0 8px 30px #0003;font-size:13px;max-width:290px';document.body.appendChild(el)}el.textContent=message;el.hidden=false;setTimeout(()=>el.hidden=true,2600)};
  function addCart(id){const p=products.find(x=>x.id===id);if(!p)return;const c=getCart();c[id]=Math.min(9999,(Number(c[id])||0)+1);putCart(c);toast(p.name+' added to inquiry list')}
function icon(name){const shapes={"arrow":"<path d=\"M4 12h15m-6-6 6 6-6 6\"/>","chat":"<path d=\"M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 21l1.8-5.4A8.5 8.5 0 1 1 21 11.5Z\"/>","cart":"<path d=\"M2 3h3l3 13h11l3-10H6M9 20h.01M18 20h.01\"/><circle cx=\"9\" cy=\"20\" r=\"1\"/><circle cx=\"18\" cy=\"20\" r=\"1\"/>","box":"<path d=\"m12 2 9 5v10l-9 5-9-5V7l9-5Zm0 10 9-5M12 12 3 7m9 5v10M7.5 4.5l9 5v5\"/>","globe":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><ellipse cx=\"12\" cy=\"12\" rx=\"4.5\" ry=\"10\"/><path d=\"M2 12h20M4 6h16M4 18h16\"/>","layers":"<path d=\"m12 2 10 6-10 6L2 8l10-6ZM2 12l10 6 10-6M2 16l10 6 10-6\"/>","shield":"<path d=\"m12 2 9 4v6c0 5-6 9-9 10-3-1-9-5-9-10V6l9-4Z\"/><path d=\"m7 12 3 3 7-7\"/>","tag":"<path d=\"M3 12 13 2h8v8L11 20 3 12Z\"/><circle cx=\"17\" cy=\"6\" r=\"1.5\"/>","gear":"<path d=\"m9 3 1-2h4l1 2 3 2 3 1v4l-2 2 2 2v4l-3 1-3 2-1 2h-4l-1-2-3-2-3-1v-4l2-2-2-2V6l3-1 3-2Z\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/>","mail":"<rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"/><path d=\"m3 6 9 7 9-7\"/>","send":"<path d=\"m22 2-7 20-4-9L2 9l20-7ZM11 13 22 2\"/>","book":"<path d=\"M12 5C8 2 4 2 1 3v17c4-1 7 0 11 3 4-3 7-4 11-3V3c-3-1-7-1-11 2Zm0 0v18M5 6v10\"/>","cubes":"<path d=\"m12 1 6 3v6l-6 3-6-3V4l6-3Zm0 6 6-3m-6 3L6 4m6 3v6M6 11l6 3v6l-6 3-6-3v-6l6-3Zm0 6 6-3m-6 3-6-3m6 3v6m12-12 6 3v6l-6 3-6-3v-6l6-3Zm0 6 6-3m-6 3-6-3m6 3v6\"/>"};return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(shapes[name]||shapes.arrow)+'</svg>'}function paw(){return '<svg class="paw-icon" viewBox="0 0 40 40" fill="currentColor" aria-hidden="true"><ellipse cx="7" cy="14" rx="5" ry="7" transform="rotate(-25 7 14)"/><ellipse cx="16" cy="7" rx="5" ry="7"/><ellipse cx="27" cy="8" rx="5" ry="7" transform="rotate(12 27 8)"/><ellipse cx="35" cy="17" rx="4.5" ry="6" transform="rotate(30 35 17)"/><path d="M10 26c3-4 4-9 10-9s8 5 11 9c6 9-2 13-8 10-3-2-4-2-7 0-8 3-12-3-6-10Z"/></svg>'}
  function header(){return `<header class="site-header"><div class="container header-content"><a href="index.html" class="logo" aria-label="ZELPETO Home">${paw()}<span>ZELPETO</span></a><button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button><nav id="main-nav" class="nav" aria-label="Main navigation"><a href="index.html" class="${page==='home'?'active':''}">Home</a><div class="nav-products"><a href="products.html" class="${page==='products'?'active':''}">Products</a><button class="category-toggle" aria-label="Show product categories" aria-expanded="false" aria-controls="nav-categories">⌄</button><div class="nav-categories" id="nav-categories" hidden>${categories.map(c=>`<a href="products.html?category=${c.id}">${textSafe(c.name)}</a>`).join('')}</div></div><a href="index.html#oem">OEM & ODM</a><a href="guides.html" class="${page==='guides'?'active':''}">Pet Care Guides</a><a href="index.html#why">About</a><a href="index.html#contact">Contact</a><a href="inquiry.html" class="btn btn-accent">${icon('chat')} Inquiry <span class="count cart-count">0</span> ↗</a></nav></div></header>`}
  function footer(){return `<footer class="site-footer"><div class="container"><div class="footer-grid"><div><a class="logo" href="index.html">${paw()}<span>ZELPETO</span></a><p>A professional B2B pet supplies provider offering comprehensive products and OEM & ODM customization for global partners.</p></div><div><h3>Quick Links</h3><a href="index.html">Home</a><a href="products.html">Products</a><a href="index.html#oem">OEM & ODM</a><a href="guides.html">Pet Care Guides</a><a href="index.html#why">About</a><a href="index.html#contact">Contact</a></div><div><h3>Product Categories</h3>${categories.map(c=>`<a href="products.html?category=${c.id}">${textSafe(c.name)}</a>`).join('')}</div><div><h3>Contact Us</h3><a class="email-link" href="mailto:niuqifan764@gmail.com">${icon('mail')} niuqifan764@gmail.com</a><a href="inquiry.html" class="btn btn-outline">Send an Inquiry ${icon('arrow')}</a></div></div><div class="footer-bottom"><span>© ${new Date().getFullYear()} ZELPETO. All rights reserved.</span><span>Product images are illustrative. Inquiries are prepared in your browser.</span></div></div></footer>`}
  function categoryCard(c){return `<a class="category-card" href="products.html?category=${c.id}"><img src="${img(c.img)}" alt="${textSafe(c.name)}" loading="lazy" decoding="async"><div class="category-bottom"><h3>${textSafe(c.name)}</h3><span class="circle-arrow" aria-hidden="true">→</span></div></a>`}
  function productCard(p){return `<article class="product-card"><button class="product-image" data-view="${p.id}" aria-label="Details for ${textSafe(p.name)}"><img src="${img(p.image)}" alt="${textSafe(p.name)}" loading="lazy"></button><div class="product-body"><h3>${textSafe(p.name)}</h3><p>${textSafe(p.subtitle)}</p><button class="btn btn-primary" data-add="${p.id}">${icon('cart')} Add to Inquiry</button></div></article>`}
  function home(){return `<section class="hero"><div class="container hero-wrap"><div class="hero-text"><div class="eyebrow">Pet Supplies · Global Sourcing</div><h1>Better Products.<br>Happier Pets.</h1><p class="hero-lead">Wholesale Pet Products | OEM & ODM Solutions</p><div class="hero-cta"><a class="btn btn-primary" href="products.html">Explore Products ${icon('arrow')}</a><a class="btn btn-outline" href="inquiry.html">${icon('chat')} Request a Quote</a></div><div class="trust-row"><span class="trust-item"><span class="trust-icon">${icon('box')}</span> Wholesale Supply</span><span class="trust-item"><span class="trust-icon">${icon('gear')}</span> OEM & ODM<br>Customization</span><span class="trust-item"><span class="trust-icon">${icon('globe')}</span> Global B2B Service</span></div></div><img fetchpriority="high" decoding="async" width="2172" height="724" class="hero-photo" src="${img('01_hero_animals.png')}" alt="Dog, cat, bird and bearded dragon in a warm home environment"></div></section>
  <section class="section" id="categories"><div class="container"><div class="section-top"><h2 class="section-heading">Shop by Category</h2><a class="section-link" href="products.html">View All Products →</a></div><div class="category-grid">${categories.map(categoryCard).join('')}</div></div></section>
  <section class="section-tight"><div class="container"><div class="guides-banner"><div class="guides-symbol" aria-hidden="true">${icon('book')}${paw()}</div><div class="guides-copy"><h2 class="section-heading">Pet Care Guides</h2><p>Practical care tips, feeding advice and housing guides for dogs, cats, birds, reptiles and more.</p></div><img class="guides-photo" src="${img('08_guides_banner_animals.png')}" alt="Sleeping dog and cat"><div class="guides-action"><a class="btn btn-accent" href="guides.html">Explore Care Guides →</a></div></div></div></section>
  <section class="section" id="featured"><div class="container"><div class="section-top"><h2 class="section-heading">Featured Products</h2><a class="section-link" href="products.html">View More Products →</a></div><div class="products-grid">${products.map(productCard).join('')}</div><p class="help" style="margin-top:20px">Images and listings are examples for layout preview only. They are not confirmed products, inventory or supplier offers.</p></div></section>
  <section id="oem" class="oem-band"><div class="container oem-layout"><div class="oem-intro"><h2>OEM & ODM<br>Customization</h2><p>Build your own pet product line with flexible and professional customization solutions.</p></div><div class="oem-item"><span class="oem-icon">${icon('tag')}</span><h3>Logo Printing</h3><p>Add your brand logo</p></div><div class="oem-item"><span class="oem-icon">${icon('layers')}</span><h3>Color Customization</h3><p>Multiple colors and materials</p></div><div class="oem-item"><span class="oem-icon">${icon('box')}</span><h3>Packaging Design</h3><p>Custom packaging to match your brand</p></div><div class="oem-item"><span class="oem-icon">${icon('cubes')}</span><h3>Bulk Wholesale</h3><p>Competitive pricing for large orders</p></div></div></section>
  <section id="why" class="section"><div class="container"><h2 class="section-heading center">Why Choose ZELPETO</h2><div class="choose-grid"><div class="choose-card"><span class="choose-icon">${icon('layers')}</span><h3>Wide Product Range</h3><p>Comprehensive pet supplies for dogs, cats, birds, reptiles, small animals and aquariums.</p></div><div class="choose-card"><span class="choose-icon">${icon('cart')}</span><h3>Flexible MOQ</h3><p>Multiple options and low minimum order quantity to support your business.</p></div><div class="choose-card"><span class="choose-icon">${icon('shield')}</span><h3>Quality Control</h3><p>Strict quality inspection to ensure safe, reliable and durable products.</p></div><div class="choose-card"><span class="choose-icon">${icon('globe')}</span><h3>Global Service</h3><p>Serving a network of distributors and pet brands worldwide with professional support.</p></div></div></div></section>
  <section id="contact" class="contact-panel"><div class="container contact-layout"><div class="contact-copy"><h2>Send Us Your<br>Sourcing Request</h2><p>Looking for a reliable pet supplies supplier?<br>Get a fast quote, catalog or customization solution from ZELPETO.</p><p class="help" style="color:#d9e2ec">This preview prepares inquiry details; it does not automatically submit an email.</p>${paw()}</div><div class="contact-right"><form class="contact-form-preview" id="homepage-inquiry"><div class="form-grid"><div class="field"><label for="hp-name">Your Name *</label><input id="hp-name" name="name" autocomplete="name" required placeholder="Enter your name"></div><div class="field"><label for="hp-company">Company *</label><input id="hp-company" name="company" autocomplete="organization" required placeholder="Enter company name"></div></div><div class="form-grid"><div class="field"><label for="hp-email">Email *</label><input id="hp-email" name="email" type="email" autocomplete="email" required placeholder="Enter your email"></div><div class="field"><label for="hp-country">Country / Region *</label><select id="hp-country" name="country" autocomplete="country-name" required><option value="">Please select</option>${["United States","United Kingdom","Canada","Australia","Germany","France","Italy","Spain","Netherlands","China","Japan","South Korea","India","United Arab Emirates","Saudi Arabia","Brazil","Mexico","South Africa","Other"].map(c=>`<option>${c}</option>`).join('')}</select></div></div><div class="field"><label for="hp-details">Inquiry Details *</label><textarea id="hp-details" name="details" required placeholder="Products, quantities, customization needs..."></textarea></div><button class="btn btn-accent" type="submit">${icon('send')} Submit Inquiry</button><p class="photo-note">Prepares your inquiry for review. No message is sent automatically.</p></form></div></div></section>`}
  function catalog(){return `<section class="page-head"><div class="container"><div class="eyebrow">Product Catalog</div><h1>Explore Pet Supplies</h1><p>Browse across pet categories, view illustrative product details, and add items to an inquiry list. Actual availability and specifications need to be confirmed.</p></div></section><section class="section"><div class="container"><div class="pill-row" id="category-filters"><button class="pill" data-category="all">All Products</button>${categories.map(c=>`<button class="pill" data-category="${c.id}">${textSafe(c.name)}</button>`).join('')}</div><div id="catalog-grid" class="catalog-grid"></div><div class="notice">All listings shown are demonstration content based on the homepage mockup. Replace them with genuine product photography and verified specifications before public launch.</div></div></section>`}
  function guidePage(){return `<section class="page-head"><div class="container"><div class="eyebrow">Learn & Explore</div><h1>Pet Care Guides</h1><p>Find future care articles by pet type. This section is reserved for educational content and will grow as articles are reviewed and published.</p></div></section><section class="section"><div class="container"><div class="guide-categories">${categories.map(c=>`<article class="guide-card"><img src="${img(c.img)}" alt="${textSafe(c.name)}" loading="lazy"><div><h3>${textSafe(c.name.replace('Supplies','Care'))}</h3><p>${textSafe(c.subtitle)}. Educational guides coming soon.</p></div></article>`).join('')}</div><div class="notice">Care guides are not published yet. Later this section can expand into category pages and individual articles with sources and review dates.</div></div></section>`}
  function inquiry(){return `<section class="page-head"><div class="container"><div class="eyebrow">Sourcing Request</div><h1>Inquiry List</h1><p>Review the selected products and prepare your sourcing message. No information is sent to a server in this version.</p></div></section><section class="section"><div class="container inquiry-layout"><div class="panel"><h2>Selected Products <span class="count cart-count" style="background:var(--orange);color:white">0</span></h2><div id="cart-items"></div><p class="help">Adjust quantities below. Items are stored only in your current browser.</p><a class="btn btn-outline" href="products.html">+ Browse More Products</a></div><div class="panel"><h2>Prepare a Quote Request</h2><form id="inquiry-form"><div class="form-grid"><div class="field"><label for="fullName">Your Name *</label><input id="fullName" name="name" required autocomplete="name"></div><div class="field"><label for="company">Company</label><input id="company" name="company" autocomplete="organization"></div></div><div class="form-grid"><div class="field"><label for="email">Business Email *</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="country">Country / Region</label><input id="country" name="country" autocomplete="country-name"></div></div><div class="field"><label for="details">Products, Quantities & Requirements *</label><textarea id="details" name="details" required placeholder="Specify needed quantities, materials, branding, target market, packaging, etc."></textarea></div><button class="btn btn-accent" type="submit">Prepare My Inquiry →</button><p class="help" style="margin-top:12px" id="sending-disclaimer"></p><div role="status" class="status" id="inquiry-status"></div><div id="inquiry-actions" style="display:none;margin-top:10px;gap:9px;flex-wrap:wrap"><button type="button" class="btn btn-primary" id="copy-inquiry">Copy Inquiry Text</button><a id="email-inquiry" class="btn btn-outline" href="#" style="display:none">Open Email App ↗</a></div></form></div></div></section>`}
  const routes={home,products:catalog,guides:guidePage,inquiry};
  const page=document.body.dataset.page||'home';
  const app=byId('app');
  if(app)app.innerHTML=header()+(routes[page]||home)()+footer()+`<a href="inquiry.html" class="btn btn-accent floating-cart" aria-label="View inquiry list">Inquiry <span class="count cart-count">0</span></a>`;
  const toggle=byId('menu-toggle');if(toggle){toggle.addEventListener('click',()=>{let open=byId('main-nav').classList.toggle('open');toggle.setAttribute('aria-expanded',String(open))})}
  const categoryToggle=document.querySelector('.category-toggle');if(categoryToggle){categoryToggle.onclick=()=>{const menu=byId('nav-categories');menu.hidden=!menu.hidden;categoryToggle.setAttribute('aria-expanded',String(!menu.hidden))};document.addEventListener('click',e=>{if(!e.target.closest('.nav-products')){byId('nav-categories').hidden=true;categoryToggle.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){byId('nav-categories').hidden=true;categoryToggle.setAttribute('aria-expanded','false')}})}
  updateCount();
  document.addEventListener('click',e=>{const add=e.target.closest('[data-add]');if(add)addCart(add.dataset.add);const view=e.target.closest('[data-view]');if(view)showProduct(view.dataset.view)});
  function showProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const overlay=document.createElement('div');overlay.className='modal-backdrop';overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${textSafe(p.name)} details"><button class="modal-close" aria-label="Close">×</button><img src="${img(p.image)}" alt="${textSafe(p.name)}"><div class="modal-copy"><div class="eyebrow">Sample Product</div><h2>${textSafe(p.name)}</h2><p>${textSafe(p.detail)}</p><p><strong>MOQ:</strong> To be confirmed<br><strong>Customization:</strong> By inquiry<br><strong>Availability:</strong> Unverified sample</p><button class="btn btn-primary" data-add="${p.id}">+ Add to Inquiry</button></div></div>`;document.body.append(overlay);const close=()=>overlay.remove();overlay.querySelector('.modal-close').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});const esc=e=>{if(e.key==='Escape'){close();document.removeEventListener('keydown',esc)}};document.addEventListener('keydown',esc);overlay.querySelector('.modal-close').focus()}
  if(page==='products'){const filterButtons=Array.from(document.querySelectorAll('[data-category]'));const initial=new URLSearchParams(location.search).get('category')||'all';const select=id=>{const valid=id==='all'||categories.some(c=>c.id===id);const current=valid?id:'all';filterButtons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===current)));const show=current==='all'?products:products.filter(p=>p.category===current);byId('catalog-grid').innerHTML=show.length?show.map(productCard).join(''):`<div class="empty" style="grid-column:1/-1">No sample products in this category yet. You can still describe your sourcing needs in an inquiry.</div>`;const target=new URL(location.href);if(current==='all')target.searchParams.delete('category');else target.searchParams.set('category',current);history.replaceState(null,'',target)};filterButtons.forEach(b=>b.onclick=()=>select(b.dataset.category));select(initial)}
  function renderCart(){const node=byId('cart-items');if(!node)return;const c=getCart();const entries=Object.entries(c).filter(([id,qty])=>products.some(p=>p.id===id)&&qty>0);if(!entries.length){node.innerHTML='<div class="empty" style="margin-bottom:18px">Your inquiry list is empty. Add products from the catalog or describe your request in the form.</div>';return}node.innerHTML=entries.map(([id,q])=>{const p=products.find(x=>x.id===id);return `<div class="cart-item"><img src="${img(p.image)}" alt="${textSafe(p.name)}"><div class="info"><h3>${textSafe(p.name)}</h3><p>Sample product · qty is indicative only</p><button data-remove="${id}">Remove</button></div><label><span class="sr-only">Quantity for ${textSafe(p.name)}</span><input aria-label="Quantity for ${textSafe(p.name)}" type="number" min="1" max="9999" value="${q}" data-quantity="${id}"></label></div>`}).join('');node.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let c=getCart();delete c[b.dataset.remove];putCart(c);renderCart()});node.querySelectorAll('[data-quantity]').forEach(i=>i.onchange=()=>{let c=getCart();c[i.dataset.quantity]=Math.max(1,Math.min(9999,parseInt(i.value)||1));putCart(c);renderCart()})}
  if(page==='home'){const hp=byId('homepage-inquiry');if(hp)hp.addEventListener('submit',e=>{e.preventDefault();if(!hp.reportValidity())return;const data={name:hp.elements.name.value,company:hp.elements.company.value,email:hp.elements.email.value,country:hp.elements.country.value,details:hp.elements.details.value};try{sessionStorage.setItem('zelpeto_home_inquiry',JSON.stringify(data))}catch(e){}location.href='inquiry.html';})}
  if(page==='inquiry'){renderCart();try{const raw=sessionStorage.getItem('zelpeto_home_inquiry');if(raw){const values=JSON.parse(raw);for(const key of ['name','company','email','country','details']){if(values[key]&&byId('inquiry-form').elements[key])byId('inquiry-form').elements[key].value=values[key]}sessionStorage.removeItem('zelpeto_home_inquiry')}}catch{}let currentMessage='';const email=(cfg.companyEmail||'').trim();byId('sending-disclaimer').textContent=email?'This form prepares an email in your email app; submitting does not automatically send it.':'This preview does not send messages. You can copy the inquiry text; add a confirmed business email in config.js to enable an email-app link.';byId('inquiry-form').addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const c=getCart();const lines=Object.entries(c).map(([id,qty])=>{const p=products.find(x=>x.id===id);return p?`- ${p.name}: ${qty} (sample item)` : ''}).filter(Boolean);currentMessage=`ZELPETO - Sourcing Inquiry\n\nName: ${f.elements.name.value.trim()}\nCompany: ${f.elements.company.value.trim()||'Not provided'}\nEmail: ${f.elements.email.value.trim()}\nCountry/Region: ${f.elements.country.value.trim()||'Not provided'}\n\nItems:\n${lines.length?lines.join('\n'):'No products selected'}\n\nRequirements:\n${f.elements.details.value.trim()}\n\nPlease confirm actual specifications, availability, MOQ and quotation.`;byId('inquiry-actions').style.display='flex';byId('inquiry-status').textContent='Your request text is ready. Nothing has been sent.';const link=byId('email-inquiry');if(email&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){link.style.display='inline-flex';link.href=`mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent('ZELPETO B2B sourcing inquiry')}&body=${encodeURIComponent(currentMessage)}`}else link.style.display='none'});byId('copy-inquiry').onclick=async()=>{try{await navigator.clipboard.writeText(currentMessage);toast('Inquiry text copied')}catch{const field=document.createElement('textarea');field.value=currentMessage;field.style.cssText='position:fixed;left:-9999px';document.body.append(field);field.select();document.execCommand('copy');field.remove();toast('Inquiry text copied')}}}
})();
</script></body></html>
